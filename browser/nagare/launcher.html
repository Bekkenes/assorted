<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nagare</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-overlay"></div>

    <div class="container">
        <div class="widget-area">
            <div id="clock" class="clock">00:00</div>
            <div id="date" class="date">Loading...</div>
            <div id="weather" class="weather-mock" style="cursor: pointer;">
                Tap to set location
            </div>
        </div>

        <div class="favorites-list" id="favorites"></div>

        <div class="app-list" id="app-list"></div>
    </div>

    <div class="alphabet-scroll" id="alphabet-scroll"></div>

    <div id="settings-btn" class="settings-trigger">⚙</div>

    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Nagare Settings</h2>
            
            <div class="section">
                <h3>Appearance</h3>
                <p class="hint">Upload an image to set as background.</p>
                <div class="row">
                    <button id="btn-upload-bg">🖼️ Upload Wallpaper</button>
                    <button id="btn-reset-bg">Reset to Dark</button>
                    <input type="file" id="wallpaper-input" accept="image/*" style="display: none;">
                </div>
                <div id="bg-status" class="status-text"></div>
            </div>

            <div class="section">
                <h3>Weather Location</h3>
                <div class="row">
                    <button id="btn-auto-loc">📍 Use GPS</button>
                    <input type="text" id="manual-loc-input" placeholder="City name (e.g. Oslo)">
                    <button id="btn-manual-loc">Search</button>
                </div>
                <div id="loc-status" class="status-text"></div>
            </div>

            <div class="section">
                <h3>Select Apps</h3>
                <p class="hint">Select bookmarks to display on your home screen.</p>
                <div id="bookmark-picker" class="bookmark-picker"></div>
            </div>

            <button id="close-settings" class="close-btn">Done</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
