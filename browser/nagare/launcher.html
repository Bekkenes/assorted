<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nagare</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-overlay"></div>

    <div class="container">
        <div class="widget-area">
            <div id="clock" class="clock">00:00</div>
            <div id="date" class="date">Loading...</div>
            <div id="weather" class="weather-mock" style="cursor: pointer;">
                Tap to set location
            </div>
        </div>

        <div class="favorites-list" id="favorites"></div>

        <div class="app-list" id="app-list"></div>
    </div>

    <div class="alphabet-scroll" id="alphabet-scroll"></div>

    <div id="settings-btn" class="settings-trigger">⚙</div>

    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Nagare Settings</h2>
            
            <div class="section">
                <h3>Add Custom App</h3>
                <div class="row">
                    <input type="text" id="custom-name" placeholder="Name (e.g. Work)" style="flex: 1;">
                    <input type="text" id="custom-url" placeholder="URL (e.g. notion.so)" style="flex: 2;">
                    <button id="btn-add-custom">Add</button>
                </div>
                <div id="add-status" class="status-text"></div>
            </div>

            <div class="section">
                <h3>Your Active Apps</h3>
                <p class="hint">Click X to remove an app.</p>
                <div id="active-apps-list" class="bookmark-picker" style="height: 120px;">
                    </div>
            </div>

            <div class="section">
                <h3>Select from Bookmarks</h3>
                <div id="bookmark-picker" class="bookmark-picker"></div>
            </div>

            <div class="section">
                <h3>Appearance & Weather</h3>
                <div class="row">
                    <button id="btn-upload-bg">🖼️ Wallpaper</button>
                    <button id="btn-reset-bg">Reset</button>
                    <button id="btn-auto-loc">📍 GPS Weather</button>
                    <input type="file" id="wallpaper-input" accept="image/*" style="display: none;">
                </div>
                 <div class="row" style="margin-top: 5px;">
                     <input type="text" id="manual-loc-input" placeholder="Or type City Name">
                     <button id="btn-manual-loc">Set City</button>
                 </div>
                <div id="status-msg" class="status-text"></div>
            </div>

            <button id="close-settings" class="close-btn">Done</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
